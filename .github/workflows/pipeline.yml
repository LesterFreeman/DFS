name: pipeline

# Scheduled workflows only run from the default branch. Cron is UTC and GitHub may start
# runs 15-60 minutes late under load, so the Sunday runs are deliberately early.
on:
  schedule:
    - cron: "0 10 * * *"      # daily, ~6am ET
    - cron: "0 23 * * 5,6"    # Fri/Sat evening (Friday injury designations)
    - cron: "40 15 * * 0"     # Sun 11:40am EDT / 10:40am EST  (1pm inactives ~11:30am ET)
    - cron: "15 16 * * 0"     # Sun 12:15pm EDT / 11:15am EST
    - cron: "40 16 * * 0"     # Sun 12:40pm EDT / 11:40am EST
    - cron: "40 18 * * 0"     # Sun  2:40pm EDT / 1:40pm EST  (late-game inactives)
    - cron: "40 19 * * 0"     # Sun  3:40pm EDT / 2:40pm EST
  workflow_dispatch:
    inputs:
      backfill:
        description: "Backfill past weeks into the backtest: DraftKings contest IDs, comma-separated (or dg:<slate id>). Leave empty for a normal run."
        required: false
        default: ""
  push:                       # redeploy the site (with the latest data) when the app changes
    branches: [main]
    paths: ["web/**", ".github/workflows/pipeline.yml"]

concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  pipeline:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Check out the data branch into ./data
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth=1 origin data:data
            git worktree add data data
          else
            git worktree add --orphan -b data data
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      - name: Use manually uploaded DKSalaries.csv / projections/*.csv if present
        run: |
          if [ -f DKSalaries.csv ]; then
            mkdir -p data/overrides
            cp DKSalaries.csv data/overrides/DKSalaries.csv
            echo "Using DKSalaries.csv from the repo root"
          fi
          if [ -d projections ]; then
            mkdir -p data/overrides/projections
            cp projections/*.csv data/overrides/projections/ 2>/dev/null || true
            echo "Uploaded projections: $(ls projections)"
          fi

      - name: Run pipeline
        if: ${{ !inputs.backfill }}
        working-directory: pipeline
        run: python -m dfs.build --data-dir ../data --out ../data/latest

      - name: Backfill past weeks
        if: ${{ inputs.backfill }}
        working-directory: pipeline
        env:
          TARGETS: ${{ inputs.backfill }}
        run: python -m dfs.backfill --data-dir ../data "$TARGETS"

      - name: Commit data snapshot
        if: always()
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin data

      - name: Open/update an issue when a source fails
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const path = 'data/latest/sources.json';
            if (!fs.existsSync(path)) return;
            const report = JSON.parse(fs.readFileSync(path, 'utf8'));
            const bad = report.sources.filter(s => ['failed', 'stale'].includes(s.status));
            const title = 'Data source failures';
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', per_page: 100 });
            const issue = open.find(i => i.title === title);
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            if (bad.length) {
              const rows = bad.map(s => `| ${s.name} | ${s.status} | ${(s.error || '').replace(/\|/g, '/')} | ${s.stale_hours ?? ''} |`);
              const body = [`Run: ${run}`, '', '| source | status | error | stale (h) |', '|---|---|---|---|', ...rows].join('\n');
              if (issue) await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body });
              else await github.rest.issues.create({ ...context.repo, title, body });
            } else if (issue) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body: `All sources healthy again. ${run}` });
              await github.rest.issues.update({ ...context.repo, issue_number: issue.number, state: 'closed' });
            }

  deploy:
    needs: pipeline
    if: always()              # deploy even if the pipeline failed, so the site shows source health
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Copy latest data from the data branch
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null \
             && git fetch --depth=1 origin data:refs/remotes/origin/data \
             && git cat-file -e origin/data:latest/players.json; then
            rm -rf web/public/data && mkdir -p web/public/data
            git archive origin/data latest | tar -x -C web/public/data --strip-components=1
          else
            echo "::warning::No pipeline output yet; deploying the bundled sample data."
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build
        working-directory: web
        env:
          VITE_REPO: ${{ github.repository }}
          VITE_REF: ${{ github.event.repository.default_branch }}
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@v5
