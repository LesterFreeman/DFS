name: pipeline

# Scheduled workflows only run from the default branch. Cron is UTC and GitHub may start
# runs 15-60 minutes late under load, so the Sunday runs are deliberately early.
on:
  schedule:
    - cron: "0 10 * * *"      # daily, ~6am ET
    - cron: "0 23 * * 5,6"    # Fri/Sat evening (Friday injury designations)
    - cron: "40 15 * * 0"     # Sun 11:40am EDT / 10:40am EST  (1pm inactives ~11:30am ET)
    - cron: "15 16 * * 0"     # Sun 12:15pm EDT / 11:15am EST
    - cron: "40 16 * * 0"     # Sun 12:40pm EDT / 11:40am EST
    - cron: "40 18 * * 0"     # Sun  2:40pm EDT / 1:40pm EST  (late-game inactives)
    - cron: "40 19 * * 0"     # Sun  3:40pm EDT / 2:40pm EST
  workflow_dispatch:

concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Check out the data branch into ./data
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth=1 origin data:data
            git worktree add data data
          else
            git worktree add --orphan -b data data
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      - name: Run pipeline
        working-directory: pipeline
        run: python -m dfs.build --data-dir ../data --out ../data/latest

      - name: Commit data snapshot
        if: always()
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin data

      - name: Open/update an issue when a source fails
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'data/latest/sources.json';
            if (!fs.existsSync(path)) return;
            const report = JSON.parse(fs.readFileSync(path, 'utf8'));
            const bad = report.sources.filter(s => ['failed', 'stale'].includes(s.status));
            const title = 'Data source failures';
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', per_page: 100 });
            const issue = open.find(i => i.title === title);
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            if (bad.length) {
              const rows = bad.map(s => `| ${s.name} | ${s.status} | ${(s.error || '').replace(/\|/g, '/')} | ${s.stale_hours ?? ''} |`);
              const body = [`Run: ${run}`, '', '| source | status | error | stale (h) |', '|---|---|---|---|', ...rows].join('\n');
              if (issue) await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body });
              else await github.rest.issues.create({ ...context.repo, title, body });
            } else if (issue) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body: `All sources healthy again. ${run}` });
              await github.rest.issues.update({ ...context.repo, issue_number: issue.number, state: 'closed' });
            }
